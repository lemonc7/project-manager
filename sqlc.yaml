version: "2"
sql:
  - engine: "postgresql"
    queries: "./database/query"
    schema: "./database/migrate"
    gen:
      go:
        package: "repo"
        out: "./internal/repo"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_interface: true
        emit_json_tags: true
        json_tags_case_style: camel

        overrides:
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "process_status"
            nullable: true
            go_type:
              type: "ProcessStatus"
              pointer: true
          - db_type: "project_status"
            nullable: true
            go_type:
              type: "ProjectStatus"
              pointer: true
          
