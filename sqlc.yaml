version: "2"
sql:
  - engine: "postgresql"
    queries: "./database/query"
    schema: "./database/migrate"
    gen:
      go:
        package: "repo"
        out: "./internal/repo"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_interface: true
        emit_json_tags: true
        json_tags_case_style: camel
        json_tags_id_uppercase: true

        overrides:
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "process_status"
            nullable: true
            go_type:
              type: "ProcessStatus"
              pointer: true
          - db_type: "project_status"
            nullable: true
            go_type:
              type: "ProjectStatus"
              pointer: true

          - column: "projects_view.remaining_days"
            go_struct_tag: 'json:"remainingDays,omitempty"'
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - column: "projects_view.duration_days"
            go_struct_tag: 'json:"durationDays,omitempty"'
          - column: "projects_view.started_at"
            go_struct_tag: 'json:"startedAt,omitempty"'
          - column: "projects_view.finished_at"
            go_struct_tag: 'json:"finishedAt,omitempty"'

          - column: "employees.team_id"
            go_struct_tag: 'json:"teamID,omitempty"'

          - column: "processes.spend_hours"
            go_struct_tag: 'json:"spendHours,omitempty"'
          - column: "processes.started_at"
            go_struct_tag: 'json:"startedAt,omitempty"'
          - column: "processes.finished_at"
            go_struct_tag: 'json:"finishedAt,omitempty"'

          - column: "projects.duration_days"
            go_struct_tag: 'json:"durationDays,omitempty"'
          - column: "projects.started_at"
            go_struct_tag: 'json:"startedAt,omitempty"'
          - column: "projects.finished_at"
            go_struct_tag: 'json:"finishedAt,omitempty"'

          - column: "todos.started_at"
            go_struct_tag: 'json:"startedAt,omitempty"'
          - column: "todos.finished_at"
            go_struct_tag: 'json:"finishedAt,omitempty"'
